aid: google-shopping
name: Google Content API for Shopping
description: >-
  The Content API for Shopping allows apps to interact directly with the Google Merchant Center platform, enabling
  management of product listings, account information, data feeds, inventory, orders, and promotions. It provides
  programmatic access to create, update, and delete products, manage shipping and tax settings, handle order workflows,
  and access reporting data for Google Shopping.
